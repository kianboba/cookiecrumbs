<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CookieCrumbs logo">
  <defs>
    <mask id="cc-bite" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="64" height="64" fill="#fff" />
      <circle cx="43.2" cy="26.2" r="4.8" fill="#000" />
    </mask>
  </defs>
  <g fill="#45a3da">
    <!-- Shield outline -->
    <path d="M32 6.6 L54.5 14.6 V32.6 C54.5 45.4 32 57.6 32 57.6 C32 57.6 9.5 45.4 9.5 32.6 V14.6 Z"
          fill="none" stroke="#45a3da" stroke-width="4.2" stroke-linejoin="round" />
    <!-- Padlock seated on the shield -->
    <path d="M28.2 10.6 V7.7 a3.8 3.8 0 0 1 7.6 0 V10.6" fill="none" stroke="#45a3da" stroke-width="2.5" />
    <rect x="25.7" y="10.2" width="12.6" height="9.4" rx="2.2" />
    <circle cx="32" cy="14" r="1.7" fill="#fff" />
    <rect x="31.3" y="14.6" width="1.4" height="2.7" rx="0.7" fill="#fff" />
    <!-- Bitten cookie -->
    <circle cx="32" cy="33" r="9.4" mask="url(#cc-bite)" />
    <circle cx="28.6" cy="30.2" r="1.25" fill="#fff" />
    <circle cx="34.6" cy="31.6" r="1.1" fill="#fff" />
    <circle cx="31.2" cy="37" r="1.15" fill="#fff" />
    <circle cx="36" cy="36.4" r="0.85" fill="#fff" />
    <!-- Satellite: info + magnifier (upper left) -->
    <circle cx="14.6" cy="19.4" r="3" />
    <circle cx="14.6" cy="18" r="0.7" fill="#fff" />
    <rect x="14.1" y="19" width="1" height="2.4" rx="0.5" fill="#fff" />
    <circle cx="19.4" cy="22.2" r="2.4" fill="none" stroke="#45a3da" stroke-width="1.4" />
    <line x1="21.2" y1="24" x2="23.4" y2="26.2" stroke="#45a3da" stroke-width="1.7" stroke-linecap="round" />
    <!-- Satellite: bell (upper right) -->
    <path d="M46 14.4 c-2.3 0-3.7 1.8-3.7 3.9 v2.2 l-1.1 1.4 h9.6 l-1.1-1.4 v-2.2 c0-2.1-1.4-3.9-3.7-3.9 z" />
    <circle cx="46" cy="22.9" r="0.85" />
    <!-- Satellite: small padlock (lower left) -->
    <path d="M23.7 42.9 v-1.5 a1.8 1.8 0 0 1 3.6 0 v1.5" fill="none" stroke="#45a3da" stroke-width="1.5" />
    <rect x="22.7" y="42.6" width="5.6" height="4.5" rx="1.1" />
    <circle cx="25.5" cy="44.4" r="0.75" fill="#fff" />
    <rect x="25.2" y="44.8" width="0.6" height="1.1" rx="0.3" fill="#fff" />
    <!-- Satellite: pie chart (lower right) -->
    <circle cx="45.5" cy="44" r="3.4" />
    <line x1="45.5" y1="44" x2="45.5" y2="40.6" stroke="#fff" stroke-width="0.9" />
    <line x1="45.5" y1="44" x2="48.9" y2="44" stroke="#fff" stroke-width="0.9" />
  </g>
</svg>
