<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cookiecrumbs-favicon.svg" />
    <link rel="mask-icon" href="/cookiecrumbs-favicon.svg" color="#45a3da" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1512" />
    <script>
      try {
        var t = localStorage.getItem("cc-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="CookieCrumbs is a Chrome extension that detects, classifies, and blocks tracking cookies as you browse, and scores every site's privacy from 0–100. Runs 100% locally — no accounts, no telemetry."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CookieCrumbs — See every cookie. Understand your privacy." />
    <meta
      property="og:description"
      content="Detect, classify, and block tracking cookies as you browse. Privacy score for every site. 100% local."
    />
    <title>CookieCrumbs — See every cookie. Understand your privacy.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
